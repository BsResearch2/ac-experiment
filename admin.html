<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Researcher Dashboard</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f8f5f0;color:#30241d}main{max-width:1100px;margin:40px auto;padding:20px}input,button{padding:12px;font:inherit;border-radius:8px;border:1px solid #d2c9c0;margin:5px}button{cursor:pointer;background:#b94b39;color:white;border:0}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.card{background:white;border-radius:14px;padding:24px}table{border-collapse:collapse;width:100%;font-size:12px;margin-top:20px}td,th{padding:10px;vertical-align:top;text-align:left;border-bottom:1px solid #eee;word-break:break-word}#err{color:#ae3326}pre{white-space:pre-wrap}small{color:#755}</style></head><body><main><h1>Researcher Dashboard</h1><p>Only a researcher account authorized in the database policy can read participants' records.</p><section class="card"><div id="login"><div class="row"><input type="email" id="email" placeholder="Researcher email"><input type="password" id="password" placeholder="Password"><button id="signIn">Sign in</button></div></div><div id="dashboard" hidden><div class="row"><button id="reload">Refresh</button><button id="download">Download CSV</button><button id="signOut">Sign out</button><label>Prolific ID <input id="filter" placeholder="Filter participants"></label></div><small id="total"></small><div style="overflow:auto"><table><thead><tr><th>Timestamp</th><th>Prolific ID</th><th>Condition</th><th>Event</th><th>Personalness</th><th>Detail</th></tr></thead><tbody id="data"></tbody></table></div></div><p id="err"></p></section></main><script src="config.js"></script><script type="module">
const cfg=window.EXPERIMENT_CONFIG||{};const $=id=>document.getElementById(id);let db,rows=[];if(!cfg.supabaseUrl||!cfg.supabaseAnonKey){$('err').textContent='Set your Supabase URL and anon key in config.js first.'}else{const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');db=createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true}});db.auth.onAuthStateChange(async(_evt,s)=>{toggle(!!s);if(s)await load()});db.auth.getSession().then(({data})=>toggle(!!data.session));}
function toggle(s){$('login').hidden=s;$('dashboard').hidden=!s;$('err').textContent=''}$('signIn').onclick=async()=>{if(!db)return;const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)$('err').textContent=error.message};$('signOut').onclick=async()=>{await db.auth.signOut();rows=[];toggle(false)};$('reload').onclick=load;$('filter').oninput=draw;
async function load(){if(!db)return;try{let accum=[],from=0;while(true){const{data,error}=await db.from('experiment_events').select('*').order('created_at',{ascending:false}).range(from,from+999);if(error)throw error;accum.push(...data);if(data.length<1000)break;from+=1000;if(from>99000)break}rows=accum;draw()}catch(e){$('err').textContent='Could not load data: '+e.message}}
function escape(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function filtered(){let s=$('filter').value.trim().toLowerCase();return rows.filter(r=>!s||r.prolific_id.toLowerCase().includes(s))}function draw(){let f=filtered();$('total').textContent=f.length+' records shown';$('data').innerHTML=f.map(r=>`<tr><td>${escape(r.created_at)}</td><td>${escape(r.prolific_id)}</td><td>${escape(r.condition)}</td><td>${escape(r.event_type)}</td><td>${escape(r.personalness_score)}</td><td>${escape(r.detail)}</td></tr>`).join('')}
$('download').onclick=()=>{const cols=['created_at','prolific_id','condition','event_type','detail','personalness_score','feedback'];const csv=[cols.join(','),...filtered().map(r=>cols.map(c=>'"'+String(typeof r[c]==='object'?JSON.stringify(r[c]):r[c]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='creator_experiment_data.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};
</script></body></html>
